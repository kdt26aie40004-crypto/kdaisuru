<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ブルー・アルバ 注文システム</title>
<!--
  HTML版（このファイル単体で動く）。ダブルクリックでブラウザが開く。
  メニュー・タグ・ルールは Python 版（menu.py / order.py / recommend.py / records.py / validation.py）と同じ内容を
  JavaScript で持っている。どちらかを変えたら、もう一方も必ず揃えること。
  注文記録はブラウザの localStorage に保存し、Python 版と同じ形式の CSV をダウンロードできる。
-->
<style>
  :root {
    --navy: #0b2545;
    --blue-900: #13315c;
    --blue-800: #1a3f73;
    --blue-700: #1d4e89;
    --blue-600: #2563c4;
    --blue-500: #3b7ddd;
    --blue-400: #6b9fe8;
    --blue-200: #bcd4f6;
    --blue-100: #e1ecfb;
    --blue-50: #f3f8ff;
    --dawn: #f6b26b;
    --text: #14213d;
    --muted: #5b6b85;
    --line: #d9e5f5;
    --error: #c62828;
    --radius: 18px;
    --shadow: 0 10px 30px rgba(19, 49, 92, .10);
    --grad-blue: linear-gradient(135deg, var(--blue-600) 0%, var(--blue-400) 100%);
    --grad-deep: linear-gradient(120deg, var(--navy) 0%, var(--blue-700) 55%, var(--blue-500) 100%);
    /* 朝焼け（店名「アルバ」＝夜明け）の差し色 */
    --coral: #ff7a59;
    --peach: #ffb38a;
    --gold: #f5b841;
    --rose: #e86a92;
    --mint: #22a88f;
    --cream: #fff8f1;
    --lavender: #a78bfa;
    --bg-base: #f4f2fb;
    --grad-dawn: linear-gradient(120deg, #ff6f61 0%, #ff9a5c 55%, #f7c548 100%);
    --grad-sky: linear-gradient(115deg, #0b2545 0%, #173f78 38%, #2f6fd0 62%, #c46d9b 84%, #ff9f7a 100%);
    /* カテゴリの差し色（.cat-0〜3 で上書き。既定は青） */
    --accent: var(--blue-600);
    --accent-2: var(--blue-400);
    --accent-soft: var(--blue-100);
    --accent-ink: var(--blue-700);
    --accent-tint: var(--blue-50);
  }
  .cat-0 { --accent: #b8693a; --accent-2: #e3a46b; --accent-soft: #fbeadb; --accent-ink: #8a4a22; --accent-tint: #fff8f2; --art-bg: #fbeee2; --art-blob: #f5dcc5; --art-shadow: #d9a77c; }
  .cat-1 { --accent: #1b9a83; --accent-2: #5ccfb2; --accent-soft: #dcf5ee; --accent-ink: #12705f; --accent-tint: #f3fcf9; --art-bg: #e2f6f0; --art-blob: #c7eee2; --art-shadow: #79cdb6; }
  .cat-2 { --accent: #e8603f; --accent-2: #ff9f7a; --accent-soft: #ffe6dc; --accent-ink: #b8442a; --accent-tint: #fff7f3; --art-bg: #ffece4; --art-blob: #ffd8c8; --art-shadow: #f2a588; }
  .cat-3 { --accent: #d4508a; --accent-2: #f39ac0; --accent-soft: #fde3ee; --accent-ink: #a5376a; --accent-tint: #fff6fa; --art-bg: #fdeaf2; --art-blob: #f8d1e2; --art-shadow: #eba2c2; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--text);
    font-family: "Yu Gothic UI", "Hiragino Sans", "Meiryo", system-ui, sans-serif;
    font-size: 15px;
    background-color: var(--bg-base);
    background-image: linear-gradient(180deg, var(--bg-base) 0%, #f7f3fb 55%, #fbf6f3 100%);
  }
  /* 背景: ラベンダー・ミント・ピーチ・空色のオーロラ（ゆっくり漂う）＋うっすら水玉 */
  body::before, body::after { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; }
  body::before {
    inset: -15%;
    background:
      radial-gradient(40% 36% at 84% 30%, rgba(160, 128, 250, .55) 0%, transparent 70%),
      radial-gradient(36% 34% at 10% 62%, rgba(80, 210, 175, .42) 0%, transparent 70%),
      radial-gradient(38% 34% at 72% 88%, rgba(255, 160, 130, .42) 0%, transparent 70%),
      radial-gradient(32% 30% at 34% 22%, rgba(110, 160, 255, .32) 0%, transparent 70%),
      radial-gradient(28% 26% at 50% 58%, rgba(236, 150, 214, .30) 0%, transparent 70%);
    filter: blur(8px);
    animation: aurora 40s ease-in-out infinite alternate;
  }
  body::after {
    background-image: radial-gradient(rgba(29, 78, 137, .07) 1px, transparent 1.6px);
    background-size: 22px 22px;
    -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 30%, #000 70%, transparent 100%);
    mask-image: linear-gradient(180deg, transparent 0%, #000 30%, #000 70%, transparent 100%);
  }
  @keyframes aurora {
    0%   { transform: translate(0, 0) rotate(0deg) scale(1); }
    50%  { transform: translate(-3%, 2%) rotate(6deg) scale(1.05); }
    100% { transform: translate(2%, -2%) rotate(-4deg) scale(1.02); }
  }
  @media (prefers-reduced-motion: reduce) { body::before { animation: none; } }
  button, input { font: inherit; }
  button {
    cursor: pointer;
    border: 1px solid var(--blue-200);
    background: #fff;
    color: var(--blue-800);
    border-radius: 999px;
    padding: 6px 14px;
    transition: background .15s, border-color .15s, box-shadow .15s, transform .15s;
  }
  button:hover:not(:disabled) { border-color: var(--blue-500); background: var(--blue-50); }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--blue-400); outline-offset: 2px; }
  button:disabled { cursor: not-allowed; opacity: .45; }
  button.primary {
    background: var(--grad-blue); border-color: transparent; color: #fff; font-weight: 700;
    box-shadow: 0 6px 16px rgba(37, 99, 196, .30);
  }
  button.primary:hover:not(:disabled) { background: var(--grad-blue); transform: translateY(-1px); box-shadow: 0 10px 22px rgba(37, 99, 196, .38); }
  input[type="text"] {
    border: 1px solid var(--blue-200);
    border-radius: 10px;
    padding: 6px 10px;
    text-align: right;
    color: var(--navy);
    background: #fff;
  }
  .error { color: var(--error); font-size: 13px; min-height: 1em; }
  .muted { color: var(--muted); }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ---- ヘッダー ---- */
  header {
    position: relative; overflow: hidden;
    display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between;
    padding: 28px 32px 78px;
    background: var(--grad-sky);
    color: #fff;
  }
  header::before, header::after { content: ""; position: absolute; border-radius: 50%; pointer-events: none; }
  header::before { width: 520px; height: 520px; left: -180px; top: -300px; background: radial-gradient(circle, rgba(255,255,255,.14), transparent 70%); }
  header::after { width: 340px; height: 340px; right: 8%; bottom: -230px; background: radial-gradient(circle, rgba(255,214,122,.95) 0%, rgba(255,150,100,.55) 35%, transparent 70%); }
  header .waves { position: absolute; left: 0; right: 0; bottom: -1px; width: 100%; height: 64px; pointer-events: none; }
  .brand { position: relative; }
  .brand .en { display: block; font-size: 12px; letter-spacing: .45em; color: #ffd9c2; margin-bottom: 4px; }
  header h1 { margin: 0; font-size: 32px; letter-spacing: .1em; text-shadow: 0 2px 12px rgba(0,0,0,.2); }
  .brand .dawn-line { display: block; width: 80px; height: 4px; margin-top: 10px; border-radius: 4px; background: linear-gradient(90deg, var(--gold), var(--coral), transparent); }
  header nav { position: relative; display: flex; flex-wrap: wrap; gap: 8px; }
  header nav button {
    background: rgba(255,255,255,.12); color: #fff; border-color: rgba(255,255,255,.35);
    backdrop-filter: blur(6px); padding: 8px 18px;
  }
  header nav button:hover:not(:disabled) { background: rgba(255,255,255,.24); border-color: #fff; }

  /* ---- レイアウト ---- */
  main {
    position: relative;
    display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 24px; align-items: start;
    max-width: 1240px; margin: -44px auto 0; padding: 0 24px 32px;
  }
  @media (max-width: 860px) { main { grid-template-columns: minmax(0, 1fr); padding: 0 16px 24px; } }
  .panel {
    background: #fff;
    border: 1px solid rgba(255,255,255,.8);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px;
  }
  /* メニューの後ろ: すりガラス＋選んでいるカテゴリの色をにじませる */
  .menu-panel {
    background:
      radial-gradient(70% 40% at 100% 0%, rgba(255, 255, 255, .55) 0%, transparent 70%),
      radial-gradient(110% 55% at 100% 100%, color-mix(in srgb, var(--accent-2) 45%, transparent) 0%, transparent 65%),
      linear-gradient(170deg, rgba(255, 255, 255, .80) 0%, color-mix(in srgb, var(--accent-soft) 80%, transparent) 45%,
        color-mix(in srgb, var(--accent-soft) 95%, var(--accent-2)) 100%);
    border: 1px solid rgba(255, 255, 255, .85);
    -webkit-backdrop-filter: blur(18px) saturate(1.4);
    backdrop-filter: blur(18px) saturate(1.4);
    box-shadow: 0 18px 40px rgba(60, 50, 120, .12), inset 0 1px 0 rgba(255, 255, 255, .9);
  }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .panel h2 { margin: 0; font-size: 18px; color: var(--blue-900); display: flex; align-items: center; gap: 10px; }
  .panel h2::before { content: ""; width: 6px; height: 20px; border-radius: 3px; background: linear-gradient(180deg, var(--blue-500), var(--rose) 60%, var(--gold)); }

  /* ---- タブ（セグメント） ---- */
  .tabs { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 5px; border-radius: 22px; background: var(--blue-100); }
  .tabs button { border: 0; background: transparent; color: var(--blue-800); padding: 7px 16px; font-weight: 600; }
  .tabs button:hover:not(:disabled) { background: rgba(255,255,255,.7); }
  .tabs button[aria-selected="true"] { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; box-shadow: 0 4px 12px rgba(20, 33, 61, .22); }
  .tabs button[class^="cat-"]::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: var(--accent); vertical-align: 1px; }
  .tabs button[class^="cat-"][aria-selected="true"]::before { background: #fff; }

  /* ---- メニューカード ---- */
  .menu-list {
    list-style: none; margin: 18px 0 0; padding: 0;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px;
  }
  .menu-item {
    position: relative; overflow: hidden;
    display: grid; grid-template-columns: 1fr auto; gap: 14px 8px; align-items: center;
    padding: 18px 16px 16px; border-radius: 14px;
    background: linear-gradient(180deg, #fff 0%, var(--accent-tint) 100%);
    border: 1px solid var(--line);
    transition: transform .15s, box-shadow .15s, border-color .15s;
  }
  .menu-item::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; z-index: 1; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
  .menu-item:hover { transform: translateY(-3px); border-color: var(--accent-2); box-shadow: 0 14px 28px rgba(20, 33, 61, .14); }
  .menu-item .name { font-weight: 700; color: var(--navy); }
  .price-chip {
    justify-self: end; padding: 3px 12px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent-ink); font-weight: 800; white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .menu-item .add, .rec-item .add, .slide .add {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 6px 14px color-mix(in srgb, var(--accent) 35%, transparent);
  }
  .menu-item .add:hover:not(:disabled), .rec-item .add:hover:not(:disabled), .slide .add:hover:not(:disabled) { background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
  .menu-item .add { justify-self: end; padding: 7px 18px; }
  .menu-item .error { grid-column: 1 / -1; margin-top: -6px; }
  .menu-item .error:empty { display: none; }

  /* 参考画像（自作イラスト） */
  .menu-item .art {
    order: -1; grid-column: 1 / -1; margin: -18px -16px 0; aspect-ratio: 16 / 10; overflow: hidden;
    border-bottom: 1px solid var(--line);
  }
  .art svg { display: block; width: 100%; height: 100%; }
  .menu-item:hover .art svg { transform: scale(1.04); }
  .menu-item .art svg { transition: transform .25s; }
  .rec-art { grid-row: 1 / span 4; width: 96px; aspect-ratio: 16 / 10; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
  .image-note { font-size: 12px; color: var(--muted); }

  /* アレルギー絞り込み */
  .allergen-bar {
    margin-bottom: 16px; padding: 14px 16px; border-radius: 14px;
    background: linear-gradient(135deg, #fff6ee, #fdeee6 60%, #f1f4fd);
    border: 1px solid #f6e0d2;
  }
  .allergen-bar .bar-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; margin-bottom: 10px; }
  .allergen-bar .title { font-weight: 700; color: var(--blue-900); }
  .allergen-bar .title small { font-weight: 400; color: var(--muted); margin-left: 6px; }
  .allergen-buttons { display: flex; flex-wrap: wrap; gap: 6px; }
  .allergen-buttons button { padding: 5px 14px; background: #fff; }
  .allergen-buttons button[aria-pressed="true"] {
    background: var(--grad-dawn); border-color: transparent; color: #fff; font-weight: 700;
    text-decoration: line-through; text-decoration-color: rgba(255, 255, 255, .85); text-decoration-thickness: 2px;
    box-shadow: 0 4px 12px rgba(255, 111, 97, .35);
  }
  .allergen-buttons .clear { border-style: dashed; color: var(--muted); }
  .allergen-status { font-size: 13px; color: #c2502f; font-weight: 700; }
  .allergen-chips { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 12px; }
  .allergen-chips .label { color: var(--muted); margin-right: 2px; }
  .allergen-chip { padding: 1px 8px; border-radius: 999px; background: #fff1e3; color: #9a4d0b; border: 1px solid #f6d3ae; font-weight: 700; }
  .allergen-chip.none { background: #eaf6ee; color: #1f6f43; border-color: #bfe3cc; }
  .empty-menu { grid-column: 1 / -1; padding: 28px 12px; text-align: center; color: var(--muted); border: 1px dashed var(--blue-200); border-radius: 14px; background: var(--blue-50); }
  .tab-count { font-size: 12px; opacity: .8; margin-left: 4px; }
  .rec-note { margin: 0 0 8px; font-size: 13px; color: var(--blue-700); font-weight: 700; }

  /* 数量ステッパー */
  .stepper { display: inline-flex; align-items: center; justify-self: start; border: 1px solid var(--accent-soft); border-radius: 999px; background: #fff; overflow: hidden; }
  .stepper button { border: 0; border-radius: 0; width: 32px; height: 32px; padding: 0; font-size: 18px; line-height: 1; color: var(--accent); background: #fff; }
  .stepper button:hover:not(:disabled) { background: var(--accent-soft); }
  .stepper input { width: 2.6em; border: 0; border-radius: 0; padding: 4px 0; text-align: center; font-weight: 700; }
  .stepper input:focus-visible { outline: 0; background: var(--blue-50); }

  /* ---- 注文パネル（濃紺） ---- */
  .order-panel {
    background:
      radial-gradient(420px 220px at 100% 100%, rgba(255, 159, 122, .28), transparent 70%),
      linear-gradient(165deg, var(--navy) 0%, var(--blue-900) 45%, var(--blue-700) 100%);
    color: #fff; border: 0;
    box-shadow: 0 18px 40px rgba(11, 37, 69, .35);
  }
  .side { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-self: start; min-width: 0; }
  @media (min-width: 861px) and (min-height: 940px) { .side { position: sticky; top: 16px; } }
  .order-panel h2 { color: #fff; }
  .order-panel h2::before { background: linear-gradient(180deg, var(--dawn), #ffd6a8); }
  .count-badge { padding: 3px 12px; border-radius: 999px; font-size: 13px; font-weight: 800; background: var(--gold); color: var(--navy); }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 9px 6px; text-align: left; }
  th { font-size: 12px; letter-spacing: .05em; font-weight: 700; }
  .order-panel th { color: var(--blue-200); border-bottom: 1px solid rgba(255,255,255,.18); }
  .order-panel td { border-bottom: 1px solid rgba(255,255,255,.10); }
  .order-panel tbody tr:hover td { background: rgba(255,255,255,.05); }
  .order-actions { display: flex; gap: 4px; justify-content: flex-end; }
  .order-actions button { padding: 3px 10px; font-size: 12px; background: transparent; color: var(--blue-100); border-color: rgba(255,255,255,.28); }
  .order-actions button:hover:not(:disabled) { background: rgba(255,255,255,.14); border-color: #fff; color: #fff; }
  .order-empty { margin: 12px 0 4px; padding: 22px 12px; text-align: center; line-height: 1.8; color: var(--blue-200); border: 1px dashed rgba(255,255,255,.25); border-radius: 12px; }
  .total { display: flex; justify-content: space-between; align-items: baseline; margin: 18px 0 16px; padding-top: 16px; border-top: 1px dashed rgba(255,255,255,.3); }
  .total .label { color: var(--blue-200); font-size: 15px; letter-spacing: .1em; }
  .total .num { font-size: 32px; font-weight: 800; color: #ffe2b8; }
  #checkout-btn {
    width: 100%; padding: 16px; font-size: 20px; letter-spacing: .3em; border-radius: 14px;
    background: var(--grad-dawn);
    box-shadow: 0 10px 26px rgba(255, 111, 97, .45);
    text-shadow: 0 1px 2px rgba(150, 50, 20, .35);
  }
  #checkout-btn:hover:not(:disabled) { background: var(--grad-dawn); box-shadow: 0 14px 30px rgba(255, 111, 97, .55); }
  #checkout-btn:disabled { box-shadow: none; }

  /* ---- 人気メニュー（スライド） ---- */
  .popular-sub { font-size: 12px; color: var(--muted); }
  .carousel { position: relative; }
  .carousel-viewport { overflow: hidden; border-radius: 16px; touch-action: pan-y; }
  .carousel-track { display: flex; transition: transform .55s cubic-bezier(.2, .8, .2, 1); }
  @media (prefers-reduced-motion: reduce) { .carousel-track { transition: none; } }
  .slide {
    flex: 0 0 100%; min-width: 0; overflow: hidden; border-radius: 16px;
    background: linear-gradient(180deg, #fff 0%, var(--accent-tint) 100%);
    border: 1px solid var(--line);
  }
  .slide-art { position: relative; aspect-ratio: 16 / 10; }
  .rank {
    position: absolute; top: 10px; left: 10px; padding: 4px 12px; border-radius: 999px;
    background: var(--grad-sky); color: #fff; font-weight: 800; font-size: 13px; letter-spacing: .05em;
    box-shadow: 0 4px 12px rgba(11, 37, 69, .3);
  }
  .rank.top { background: linear-gradient(135deg, #f7c548, #ffa94d); color: #5a3400; }
  .slide-body { display: grid; gap: 8px; padding: 14px 16px 16px; }
  .slide-title { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .slide-title strong { font-size: 17px; color: var(--navy); }
  .slide-meta { font-size: 12px; font-weight: 700; color: var(--accent-ink); }
  .slide .add { padding: 9px; }
  .carousel-nav {
    position: absolute; top: 24%; width: 38px; height: 38px; padding: 0; border-radius: 50%;
    background: rgba(255, 255, 255, .92); border-color: transparent; color: var(--navy);
    font-size: 22px; line-height: 1; box-shadow: 0 4px 14px rgba(11, 37, 69, .2);
  }
  .carousel-nav:hover:not(:disabled) { background: #fff; }
  .carousel-nav.prev { left: 8px; }
  .carousel-nav.next { right: 8px; }
  .carousel-nav[hidden] { display: none; }
  .carousel-dots { display: flex; justify-content: center; gap: 6px; margin-top: 12px; }
  .carousel-dots button { width: 10px; height: 10px; padding: 0; border: 0; border-radius: 999px; background: var(--blue-200); transition: width .2s, background .2s; }
  .carousel-dots button[aria-current="true"] { width: 26px; background: var(--grad-dawn); }
  .popular-empty { padding: 24px 12px; text-align: center; color: var(--muted); border: 1px dashed var(--blue-200); border-radius: 14px; }

  /* ---- ダイアログ ---- */
  dialog {
    border: 0; border-radius: 22px; padding: 0;
    width: min(900px, calc(100vw - 32px)); max-height: calc(100vh - 32px);
    background: #fff; color: var(--text);
    box-shadow: 0 30px 80px rgba(11, 37, 69, .40);
  }
  dialog::backdrop { background: rgba(11, 37, 69, .55); backdrop-filter: blur(3px); }
  .dialog-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 22px; background: var(--grad-sky); color: #fff; }
  .dialog-head h2 { margin: 0; font-size: 18px; letter-spacing: .05em; }
  .dialog-head button { background: rgba(255,255,255,.12); color: #fff; border-color: rgba(255,255,255,.4); }
  .dialog-head button:hover:not(:disabled) { background: rgba(255,255,255,.24); }
  .dialog-body { padding: 22px; overflow: auto; }
  .dialog-body th { color: var(--blue-700); background: var(--blue-50); }
  .dialog-body td { border-bottom: 1px solid var(--line); }
  .dialog-foot { display: flex; gap: 10px; justify-content: flex-end; padding: 0 22px 22px; }
  .dialog-foot button { padding: 10px 22px; }
  #checkout-dialog { width: min(540px, calc(100vw - 32px)); }
  #checkout-dialog .dialog-foot .primary { background: var(--grad-dawn); box-shadow: 0 8px 20px rgba(255, 111, 97, .4); }

<script>
"use strict";

// ===== データ（menu.py と同じ内容） =====

const STORE_NAME = "ブルー・アルバ";

// [カテゴリ名, [[品名, 価格(円・税込)], ...]]
const MENU = [
  ["コーヒー", [
    ["ブレンドコーヒー", 480], ["アメリカーノ", 500], ["カフェラテ", 580],
    ["カプチーノ", 580], ["カフェモカ", 620], ["アイスコーヒー", 480],
  ]],
  ["ティー・ソフトドリンク", [
    ["ダージリンティー", 520], ["アールグレイ", 520], ["抹茶ラテ", 600],
    ["オレンジジュース", 450], ["自家製レモネード", 550],
  ]],
  ["フード", [
    ["ミックスサンドイッチ", 780], ["BLTサンド", 850], ["ナポリタン", 980],
    ["カルボナーラ", 1080], ["オムライス", 1050], ["本日のスープセット", 680],
  ]],
  ["デザート", [
    ["ベイクドチーズケーキ", 550], ["ガトーショコラ", 550], ["自家製プリン", 480],
    ["フレンチトースト", 750], ["バニラアイス", 380],
  ]],
];

// 品名 -> おすすめ判定用のタグ（気分・温度・カフェイン）
const ITEM_TAGS = {
  "ブレンドコーヒー": ["カフェイン", "温かい", "すっきり"],
  "アメリカーノ": ["カフェイン", "温かい", "すっきり"],
  "カフェラテ": ["カフェイン", "温かい"],
  "カプチーノ": ["カフェイン", "温かい"],
  "カフェモカ": ["カフェイン", "温かい", "甘い"],
  "アイスコーヒー": ["カフェイン", "冷たい", "すっきり"],
  "ダージリンティー": ["カフェイン", "温かい", "すっきり"],
  "アールグレイ": ["カフェイン", "温かい", "すっきり"],
  "抹茶ラテ": ["カフェイン", "温かい", "甘い"],
  "オレンジジュース": ["冷たい", "すっきり"],
  "自家製レモネード": ["冷たい", "すっきり"],
  "ミックスサンドイッチ": ["軽め"],
  "BLTサンド": ["軽め"],
  "ナポリタン": ["温かい", "しっかり"],
  "カルボナーラ": ["温かい", "しっかり"],
  "オムライス": ["温かい", "しっかり"],
  "本日のスープセット": ["温かい", "軽め"],
  "ベイクドチーズケーキ": ["甘い"],
  "ガトーショコラ": ["甘い"],
  "自家製プリン": ["冷たい", "甘い"],
  "フレンチトースト": ["温かい", "甘い"],
  "バニラアイス": ["冷たい", "甘い", "軽め"],
};

const PRICES = Object.fromEntries(MENU.flatMap(([, items]) => items));

// アレルギー表示の対象（食品表示で表示義務のある特定原材料8品目）。ボタンや表示はこの順で並べる。
const ALLERGENS = ["えび", "かに", "くるみ", "小麦", "そば", "卵", "乳", "落花生"];

// 品名 -> 含まれる特定原材料（menu.py の ITEM_ALLERGENS と同じ）。
// ※一般的なレシピを想定した仮のデータ。実際に提供する前に、必ず店舗のレシピ・仕入れ品で確認すること。
const ITEM_ALLERGENS = {
  "ブレンドコーヒー": [],
  "アメリカーノ": [],
  "カフェラテ": ["乳"],
  "カプチーノ": ["乳"],
  "カフェモカ": ["乳"],
  "アイスコーヒー": [],
  "ダージリンティー": [],
  "アールグレイ": [],
  "抹茶ラテ": ["乳"],
  "オレンジジュース": [],
  "自家製レモネード": [],
  "ミックスサンドイッチ": ["小麦", "卵", "乳"],
  "BLTサンド": ["小麦", "卵"],
  "ナポリタン": ["小麦", "乳"],
  "カルボナーラ": ["小麦", "卵", "乳"],
  "オムライス": ["卵", "乳"],
  "本日のスープセット": ["小麦", "乳"],
  "ベイクドチーズケーキ": ["小麦", "卵", "乳"],
  "ガトーショコラ": ["小麦", "卵", "乳"],
  "自家製プリン": ["卵", "乳"],
  "フレンチトースト": ["小麦", "卵", "乳"],
  "バニラアイス": ["卵", "乳"],
};

/** 品に含まれる特定原材料を ALLERGENS の順で返す。 */
function allergensOf(name) {
  const contained = ITEM_ALLERGENS[name] || [];
  return ALLERGENS.filter((a) => contained.includes(a));
}

/** 除外するアレルギーのどれかを含む品なら true。情報が登録されていない品は、安全のため絞り込み中は隠す。 */
function isHiddenByAllergens(name, excluded) {
  if (excluded.size === 0) return false;
  if (!(name in ITEM_ALLERGENS)) return true;
  return ITEM_ALLERGENS[name].some((a) => excluded.has(a));
}

/** 除外するアレルギーを含む品を取り除いたメニュー（カテゴリは残す）。 */
function filterMenu(menu, excluded) {
  return menu.map(([category, items]) => [category, items.filter(([name]) => !isHiddenByAllergens(name, excluded))]);
}

function categoryOf(name) {
  const found = MENU.find(([, items]) => items.some(([itemName]) => itemName === name));
  return found ? found[0] : "その他";
}

function formatPrice(price) {
  return "¥" + price.toLocaleString("ja-JP");
}

// ===== 入力チェック（validation.py と同じルール） =====

const AGE_MIN = 0, AGE_MAX = 120, BUDGET_MAX = 100000;

class InputError extends Error {}

/** 入力文字列を整数に変換する。全角数字も可。不正なら理由付きの InputError。 */
function parseIntInput(text, label, minimum = null, maximum = null, required = true) {
  const s = String(text ?? "").normalize("NFKC").trim();
  if (s === "") {
    if (required) throw new InputError(`${label}を入力してください。`);
    return null;
  }
  if (/^-?(\d+\.\d*|\.\d+)$/.test(s)) throw new InputError(`${label}は整数で入力してください。`);
  if (!/^-?\d+$/.test(s)) throw new InputError(`${label}は数字で入力してください。`);
  const value = Number(s) || 0;  // "-0" を 0 にそろえる
  if (value < 0 && (minimum === null || minimum >= 0)) throw new InputError(`${label}にマイナスの値は入力できません。`);
  if ((minimum !== null && value < minimum) || (maximum !== null && value > maximum)) {
    throw new InputError(`${label}は${minimum}〜${maximum}の範囲で入力してください。`);
  }
  return value;
}
const parseAge = (text) => parseIntInput(text, "年齢", AGE_MIN, AGE_MAX, false);
const parseBudget = (text) => parseIntInput(text, "予算", 0, BUDGET_MAX, false);

// ===== 注文（order.py と同じルール） =====

class OrderError extends Error {}

class Order {
  static MAX_QUANTITY = 99;

  constructor() {
    this.lines = [];  // [{name, price, quantity}]（同じ品は1行にまとめる）
    this.checkedOut = false;
  }

  ensureOpen() {
    if (this.checkedOut) throw new OrderError("会計済みの注文は変更できません。");
  }

  add(name, price, quantity) {
    this.ensureOpen();
    if (!(quantity >= 1 && quantity <= Order.MAX_QUANTITY)) {
      throw new OrderError(`数量は1〜${Order.MAX_QUANTITY}で指定してください。`);
    }
    const line = this.lines.find((l) => l.name === name);
    if (line) {
      if (line.quantity + quantity > Order.MAX_QUANTITY) {
        throw new OrderError(`1品あたりの数量は${Order.MAX_QUANTITY}までです。`);
      }
      line.quantity += quantity;
    } else {
      this.lines.push({ name, price, quantity });
    }
  }

  /** 明細 index を取り消す。quantity 省略時はその品をすべて取り消す。 */
  cancel(index, quantity = null) {
    this.ensureOpen();
    const line = this.lines[index];
    if (!line) throw new OrderError("指定された注文がありません。");
    if (quantity === null || quantity >= line.quantity) {
      this.lines.splice(index, 1);
    } else {
      line.quantity -= quantity;
    }
  }

  total() {
    return this.lines.reduce((sum, l) => sum + l.price * l.quantity, 0);
  }

  isEmpty() {
    return this.lines.length === 0;
  }

  checkout() {
    this.ensureOpen();
    if (this.isEmpty()) throw new OrderError("注文がありません。");
    this.checkedOut = true;
    return this.total();
  }
}

// ===== 注文記録（records.py 相当。保存先はブラウザの localStorage） =====

const STORAGE_KEY = "blue-alba-orders";
const CSV_HEADER = ["注文ID", "日時", "品名", "単価", "数量", "小計", "注文合計"];

/** 記録された注文を古い順に返す。壊れたデータは読み飛ばす。読めなければ例外。 */
function loadOrders() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return [];
  let data;
  try {
    data = JSON.parse(raw);
  } catch {
    return [];
  }
  if (!Array.isArray(data)) return [];
  return data
    .filter((o) => o && typeof o.id === "string" && typeof o.orderedAt === "string" && Array.isArray(o.lines))
    .map((o) => {
      const lines = o.lines.filter((l) => l && typeof l.name === "string"
        && Number.isInteger(l.price) && Number.isInteger(l.quantity));
      return { id: o.id, orderedAt: o.orderedAt, lines, total: lines.reduce((s, l) => s + l.price * l.quantity, 0) };
    })
    .filter((o) => o.lines.length > 0);
}

/** 注文を記録して注文ID（YYYYMMDD-HHMMSS）を返す。保存できなければ例外。 */
function saveOrder(order) {
  const now = new Date();
  const p = (n) => String(n).padStart(2, "0");
  const ymd = `${now.getFullYear()}${p(now.getMonth() + 1)}${p(now.getDate())}`;
  const hms = `${p(now.getHours())}${p(now.getMinutes())}${p(now.getSeconds())}`;
  const record = {
    id: `${ymd}-${hms}`,
    orderedAt: `${now.getFullYear()}-${p(now.getMonth() + 1)}-${p(now.getDate())} ${p(now.getHours())}:${p(now.getMinutes())}:${p(now.getSeconds())}`,
    lines: order.lines.map((l) => ({ ...l })),
  };
  const orders = loadOrders();
  orders.push(record);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(orders.map(({ total, ...rest }) => rest)));
  return record.id;
}

function loadItemSales() {
  const sales = {};
  try {
    for (const order of loadOrders()) {
      for (const l of order.lines) sales[l.name] = (sales[l.name] || 0) + l.quantity;
    }
  } catch {
    // 読めなければ人気は考慮しない
  }
  return sales;
}

function summarize(orders) {
  const byDate = new Map(), byItem = new Map(), byCategory = new Map();
  const bump = (map, key, quantity, sales) => {
    const d = map.get(key) || { quantity: 0, sales: 0, orders: 0 };
    d.quantity += quantity;
    d.sales += sales;
    map.set(key, d);
    return d;
  };
  for (const order of orders) {
    bump(byDate, order.orderedAt.slice(0, 10), 0, order.total).orders += 1;
    for (const l of order.lines) {
      const subtotal = l.price * l.quantity;
      bump(byItem, l.name, l.quantity, subtotal);
      bump(byCategory, categoryOf(l.name), l.quantity, subtotal);
    }
  }
  const totalSales = orders.reduce((s, o) => s + o.total, 0);
  const bySales = (map) => [...map.entries()].sort((a, b) => b[1].sales - a[1].sales);
  return {
    orderCount: orders.length,
    totalSales,
    average: orders.length ? Math.floor(totalSales / orders.length) : 0,
    byDate: [...byDate.entries()].sort((a, b) => a[0].localeCompare(b[0])),
    byItem: bySales(byItem),
    byCategory: bySales(byCategory),
  };
}

/** Python 版の data/orders.csv と同じ形式（BOM 付き UTF-8）の CSV 文字列。 */
function ordersToCsv(orders) {
  const cell = (v) => {
    const s = String(v);
    return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const rows = [CSV_HEADER];
  for (const o of orders) {
    for (const l of o.lines) rows.push([o.id, o.orderedAt, l.name, l.price, l.quantity, l.price * l.quantity, o.total]);
  }
  return "﻿" + rows.map((r) => r.map(cell).join(",")).join("\r\n") + "\r\n";
}

// ===== おすすめ（recommend.py と同じルール） =====

const MOODS = [["甘いもの", "甘い"], ["しっかり食べたい", "しっかり"], ["軽めに", "軽め"], ["すっきりしたい", "すっきり"]];
const TEMPERATURES = [["温かいもの", "温かい"], ["冷たいもの", "冷たい"]];
const OPPOSITE_TEMPERATURE = { "温かい": "冷たい", "冷たい": "温かい" };
const CAFFEINE_TAG = "カフェイン";
const CHILD_AGE = 12;

function recommend({ menu = MENU, sales, mood = null, temperature = null, budget = null, age = null, limit = 3 }) {
  const isChild = age !== null && age <= CHILD_AGE;
  const candidates = [];
  for (const [category, items] of menu) {
    for (const [name, price] of items) {
      const tags = new Set(ITEM_TAGS[name] || []);
      if (mood && !tags.has(mood)) continue;
      if (temperature && tags.has(OPPOSITE_TEMPERATURE[temperature])) continue;
      if (budget !== null && price > budget) continue;
      if (isChild && tags.has(CAFFEINE_TAG)) continue;
      candidates.push({ name, price, category, tags, order: candidates.length });
    }
  }
  // 温度一致 → 販売数が多い → メニュー順
  candidates.sort((a, b) =>
    (Number(b.tags.has(temperature)) - Number(a.tags.has(temperature)))
    || ((sales[b.name] || 0) - (sales[a.name] || 0))
    || (a.order - b.order));

  const moodLabel = Object.fromEntries(MOODS.map(([label, tag]) => [tag, label]));
  return candidates.slice(0, limit).map(({ name, price, category, tags }) => {
    const reasons = [];
    if (mood) reasons.push(`気分「${moodLabel[mood]}」にぴったり`);
    if (temperature && tags.has(temperature)) reasons.push(`${temperature}品`);
    if (isChild) reasons.push("お子さまにも安心（カフェインなし）");
    if ((sales[name] || 0) > 0) reasons.push(`人気（これまでに${sales[name]}個）`);
    return { name, price, category, reasons };
  });
}

/** 要素を作る小さなヘルパー。文字列は textContent として入れる（HTML として解釈しない）。 */
function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (key === "class") node.className = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else if (key in node) node[key] = value;
    else node.setAttribute(key, value);
  }
  for (const child of children.flat()) {
    if (child !== null && child !== undefined) node.append(child instanceof Node ? child : String(child));
  }
  return node;
}

const $ = (id) => document.getElementById(id);
let order = new Order();
let currentCategory = 0;
const excludedAllergens = new Set();  // 除外するアレルギー（メニューとおすすめで共通）

function toast(message) {
  const t = $("toast");
  t.textContent = message;
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"), 1800);
}

/** 数量文字列をチェックして注文に追加する。成功なら null、失敗ならエラーメッセージ。 */
function addToOrder(name, quantityText) {
  try {
    const quantity = parseIntInput(quantityText, "数量", 1, Order.MAX_QUANTITY);
    order.add(name, PRICES[name], quantity);
  } catch (e) {
    if (e instanceof InputError || e instanceof OrderError) return e.message;
    throw e;
  }
  renderOrder();
  toast(`${name} を追加しました`);
  return null;
}

function renderTabs() {
  const visible = filterMenu(MENU, excludedAllergens);
  const tabs = $("category-tabs");
  tabs.replaceChildren(...MENU.map(([category, items], i) => {
    const shown = visible[i][1].length;
    return el("button", {
      type: "button", role: "tab", class: `cat-${i}`, "aria-selected": String(i === currentCategory),
      onclick: () => { currentCategory = i; renderTabs(); renderMenu(); },
    }, category, shown < items.length ? el("span", { class: "tab-count" }, `(${shown})`) : null);
  }));
}

function formatExcluded() {
  return ALLERGENS.filter((a) => excludedAllergens.has(a)).join("・");
}

function renderAllergenBar() {
  $("allergen-buttons").replaceChildren(
    ...ALLERGENS.map((allergen) => el("button", {
      type: "button", "aria-pressed": String(excludedAllergens.has(allergen)),
      title: `${allergen}を含む料理を${excludedAllergens.has(allergen) ? "表示する" : "隠す"}`,
      onclick: () => { excludedAllergens.has(allergen) ? excludedAllergens.delete(allergen) : excludedAllergens.add(allergen); onAllergensChanged(); },
    }, allergen)),
    el("button", {
      type: "button", class: "clear", disabled: excludedAllergens.size === 0,
      onclick: () => { excludedAllergens.clear(); onAllergensChanged(); },
    }, "すべて解除"));
  const hidden = MENU.flatMap(([, items]) => items).filter(([name]) => isHiddenByAllergens(name, excludedAllergens)).length;
  $("allergen-status").textContent = excludedAllergens.size ? `${formatExcluded()} を含む ${hidden}品を非表示中` : "";
}

function onAllergensChanged() {
  renderAllergenBar();
  renderTabs();
  renderMenu();
  renderPopular();
  if ($("recommend-dialog").open) renderRecommend();
}

  const step = (delta) => {
    let value;
    try {
      value = parseIntInput(input.value, "数量", 1, Order.MAX_QUANTITY);
    } catch {
      value = 1 - delta;  // 不正な値のときは 1 に戻す
    }
    input.value = String(Math.min(Order.MAX_QUANTITY, Math.max(1, value + delta)));
  };
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") onEnter(); });
  const stepper = el("div", { class: "stepper" },
    el("button", { type: "button", "aria-label": "1つ減らす", onclick: () => step(-1) }, "−"),
    input,
    el("button", { type: "button", "aria-label": "1つ増やす", onclick: () => step(1) }, "＋"));
  return { stepper, input };
}

/** カテゴリ名 → 色のクラス（cat-0〜3）。 */
function categoryClass(category) {
  const index = MENU.findIndex(([c]) => c === category);
  return index >= 0 ? `cat-${index}` : "";
}

function renderMenu() {
  $("menu-list").className = `menu-list cat-${currentCategory}`;
  $("menu-panel").className = `panel menu-panel cat-${currentCategory}`;  // 背景もカテゴリの色に
  const [, items] = filterMenu(MENU, excludedAllergens)[currentCategory];
  if (items.length === 0) {
    $("menu-list").replaceChildren(el("li", { class: "empty-menu" },
      `${formatExcluded()} を含まない料理は、このカテゴリにはありません。`));
    return;
  }
  $("menu-list").replaceChildren(...items.map(([name, price]) => {
    const error = el("span", { class: "error", role: "alert" });
    const add = () => { error.textContent = addToOrder(name, input.value) || ""; };
    const { stepper, input } = quantityStepper(name, add);
    return el("li", { class: "menu-item" },
      el("span", { class: "name" }, name),
      itemArt(name),
      el("span", { class: "price-chip" }, formatPrice(price)),
      allergenChips(name),
      stepper,
      el("button", { type: "button", class: "add primary", onclick: add }, "追加"),
      error);
  }));
}

function renderOrder() {
  $("order-lines").replaceChildren(...order.lines.map((line, i) => el("tr", {},
    el("td", {}, line.name),
    el("td", { class: "num" }, line.quantity),
    el("td", { class: "num" }, formatPrice(line.price * line.quantity)),
    el("td", {}, el("div", { class: "order-actions" },
      el("button", { type: "button", onclick: () => { order.cancel(i, 1); renderOrder(); } }, "1個取消"),
      el("button", { type: "button", onclick: () => { order.cancel(i); renderOrder(); } }, "取消"))))));
  $("order-empty").hidden = !order.isEmpty();
  const count = order.lines.reduce((sum, l) => sum + l.quantity, 0);
  $("order-count").textContent = `${count}点`;
  $("order-total").textContent = formatPrice(order.total());
  $("checkout-btn").disabled = order.isEmpty();
}

// ---- 会計 ----

function openCheckout() {
  if (order.isEmpty()) return;
  const rows = order.lines.map((l) => el("tr", {},
    el("td", {}, l.name), el("td", { class: "num" }, l.quantity), el("td", { class: "num" }, formatPrice(l.price * l.quantity))));
  $("checkout-body").replaceChildren(
    el("div", { class: "table-wrap" }, el("table", {},
      el("thead", {}, el("tr", {}, el("th", {}, "品名"), el("th", { class: "num" }, "数量"), el("th", { class: "num" }, "小計"))),
      el("tbody", {}, rows))),
    el("div", { class: "big-total" }, `合計金額 ${formatPrice(order.total())}`),
    el("p", { class: "error", id: "checkout-error", role: "alert" }));
  $("checkout-foot").replaceChildren(
    el("button", { type: "button", onclick: () => $("checkout-dialog").close() }, "戻る"),
    el("button", { type: "button", class: "primary", onclick: confirmCheckout }, "会計を確定する"));
  $("checkout-dialog").showModal();
}

function confirmCheckout() {
  // 記録できなかった注文を会計済みにしないよう、記録を先に行う
  let orderId;
  try {
    orderId = saveOrder(order);
  } catch (e) {
    $("checkout-error").textContent =
      `注文を記録できませんでした（${e.message}）。ブラウザの保存設定を確認して、もう一度お試しください。`;
    return;
  }
  const total = order.checkout();
  $("checkout-body").replaceChildren(el("div", { class: "done" },
    el("div", { class: "big-total" }, `お会計 ${formatPrice(total)}`),
    el("div", {}, `注文ID ${orderId} として記録しました。`),
    el("div", {}, "ありがとうございました。")));
  $("checkout-foot").replaceChildren(el("button", { type: "button", class: "primary", onclick: () => $("checkout-dialog").close() }, "次の注文へ"));
  order = new Order();
  renderOrder();
  renderPopular();  // 注文数が変わったので人気メニューを更新
}

// ---- 人気メニュー（スライド） ----

const POPULAR_LIMIT = 5;
const SLIDE_INTERVAL_MS = 4500;
const reduceMotion = window.matchMedia?.("(prefers-reduced-motion: reduce)").matches ?? false;
let popularIndex = 0;
let popularTimer = null;
let popularPaused = false;

/** 注文数（記録上の販売数）の多い品を多い順に返す。同数ならメニュー順。絞り込み中のアレルギーを含む品は除く。 */
function popularItems(sales, excluded, limit = POPULAR_LIMIT) {
  return filterMenu(MENU, excluded)
    .flatMap(([category, items]) => items.map(([name, price]) => ({ name, price, category, count: sales[name] || 0 })))
    .map((item, order) => ({ ...item, order }))
    .filter((item) => item.count > 0)
    .sort((a, b) => b.count - a.count || a.order - b.order)
    .slice(0, limit)
    .map(({ order, ...item }) => item);
}

/** 注文データがまだないときに紹介する品（各カテゴリの先頭の品）。 */
function featuredItems(excluded) {
  return filterMenu(MENU, excluded)
    .filter(([, items]) => items.length > 0)
    .map(([category, items]) => ({ name: items[0][0], price: items[0][1], category, count: 0 }));
}

function renderPopular() {
  let items = popularItems(loadItemSales(), excludedAllergens);
  const ranked = items.length > 0;
  if (!ranked) items = featuredItems(excludedAllergens);
  $("popular-title").textContent = ranked ? "人気メニュー" : "注目のメニュー";
  $("popular-sub").textContent = ranked ? `注文数トップ${items.length}` : "会計すると注文数の多い順に紹介します";
  popularIndex = Math.min(popularIndex, Math.max(items.length - 1, 0));

  if (items.length === 0) {
    $("popular-track").replaceChildren(el("div", { class: "slide popular-empty" }, "表示できるメニューがありません。"));
  } else {
    $("popular-track").replaceChildren(...items.map((item, i) => {
      const art = itemArt(item.name, "art slide-art");
      if (ranked) art.append(el("span", { class: i === 0 ? "rank top" : "rank" }, `No.${i + 1}`));
      return el("article", {
        class: `slide ${categoryClass(item.category)}`, "aria-roledescription": "slide", "aria-label": `${i + 1} / ${items.length}`,
      },
        art,
        el("div", { class: "slide-body" },
          el("div", { class: "slide-title" }, el("strong", {}, item.name), el("span", { class: "price-chip" }, formatPrice(item.price))),
          el("div", { class: "slide-meta" }, ranked ? `これまでに ${item.count}個 注文 ｜ ${item.category}` : item.category),
          allergenChips(item.name),
          el("button", {
            type: "button", class: "add primary",
            onclick: () => { const error = addToOrder(item.name, "1"); if (error) toast(error); },
          }, "注文に追加")));
    }));
  }
  $("popular-dots").replaceChildren(...items.map((item, i) => el("button", {
    type: "button", "aria-label": `${i + 1}枚目（${item.name}）を表示`, onclick: () => showSlide(i),
  })));
  showSlide(popularIndex);
  restartAutoplay();
}

function slideCount() {
  return $("popular-track").querySelectorAll("article.slide").length;
}

function showSlide(index) {
  const count = slideCount();
  popularIndex = count ? ((index % count) + count) % count : 0;
  $("popular-track").style.transform = `translateX(-${popularIndex * 100}%)`;
  // 見えていないスライドのボタンにはフォーカスが行かないようにする
  $("popular-track").querySelectorAll("article.slide").forEach((slide, i) => { slide.inert = i !== popularIndex; });
  [...$("popular-dots").children].forEach((dot, i) => dot.setAttribute("aria-current", String(i === popularIndex)));
  $("popular-prev").hidden = $("popular-next").hidden = count <= 1;
}

function restartAutoplay() {
  clearInterval(popularTimer);
  if (reduceMotion) return;  // 動きを減らす設定の人には自動で動かさない
  popularTimer = setInterval(() => {
    if (!popularPaused && !document.hidden && slideCount() > 1) showSlide(popularIndex + 1);
  }, SLIDE_INTERVAL_MS);
}

function setupPopular() {
  const carousel = $("popular-carousel");
  $("popular-prev").addEventListener("click", () => { showSlide(popularIndex - 1); restartAutoplay(); });
  $("popular-next").addEventListener("click", () => { showSlide(popularIndex + 1); restartAutoplay(); });
  carousel.addEventListener("mouseenter", () => { popularPaused = true; });
  carousel.addEventListener("mouseleave", () => { popularPaused = false; });
  carousel.addEventListener("focusin", () => { popularPaused = true; });
  carousel.addEventListener("focusout", () => { popularPaused = false; });
  // スワイプ（指やペンで左右に払う）
  let startX = null;
  carousel.addEventListener("pointerdown", (e) => { startX = e.clientX; });
  carousel.addEventListener("pointerup", (e) => {
    if (startX === null) return;
    const dx = e.clientX - startX;
    startX = null;
    if (Math.abs(dx) > 40) { showSlide(popularIndex + (dx < 0 ? 1 : -1)); restartAutoplay(); }
  });
}

// ---- おすすめ ----

let recommendSales = {};

function setupRecommend() {
  const radios = (containerId, name, options) => {
    $(containerId).replaceChildren(...[["こだわらない", ""], ...options].map(([label, value]) => el("label", {},
      el("input", { type: "radio", name, value, checked: value === "", onchange: renderRecommend }), label)));
  };
  radios("mood-choices", "mood", MOODS);
  radios("temperature-choices", "temperature", TEMPERATURES);
  $("budget").addEventListener("input", renderRecommend);
  $("age").addEventListener("input", renderRecommend);
  $("age-note").textContent = `（空欄で指定なし・${CHILD_AGE}歳以下はカフェインなしの品をおすすめ）`;
}

function openRecommend() {
  recommendSales = loadItemSales();
  renderRecommend();
  $("recommend-dialog").showModal();
}

function renderRecommend() {
  const checked = (name) => document.querySelector(`input[name="${name}"]:checked`).value || null;
  const errors = [];
  let budget = null, age = null;
  try { budget = parseBudget($("budget").value); } catch (e) { errors.push(e.message); }
  try { age = parseAge($("age").value); } catch (e) { errors.push(e.message); }
  // 入力に誤りがある間は、おすすめを出さずに理由だけを表示する
  $("recommend-error").textContent = errors.join("　");
  const note = $("recommend-allergen-note");
  note.hidden = excludedAllergens.size === 0;
  note.textContent = `アレルギー ${formatExcluded()} を含む料理はおすすめしません（メニュー画面で変更できます）`;
  const results = errors.length ? [] : recommend({
    menu: filterMenu(MENU, excludedAllergens),
    sales: recommendSales, mood: checked("mood"), temperature: checked("temperature"), budget, age,
  });
  $("recommend-empty").hidden = errors.length > 0 || results.length > 0;
  $("recommend-list").replaceChildren(...results.map((r) => {
    const error = el("span", { class: "error", role: "alert" });
    const add = () => { error.textContent = addToOrder(r.name, input.value) || ""; };
    const { stepper, input } = quantityStepper(r.name, add);
    return el("li", { class: `rec-item ${categoryClass(r.category)}` },
      itemArt(r.name, "art rec-art"),
      el("strong", {}, r.name),
      el("span", { class: "price-chip" }, formatPrice(r.price)),
      stepper,
      el("button", { type: "button", class: "add primary", onclick: add }, "注文に追加"),
      el("span", { class: "reasons" }, `${r.category}｜${r.reasons.join(" / ") || "おすすめ"}`),
      allergenChips(r.name),
      error);
  }));
}

// ---- 注文履歴・集計 ----

let historyTab = "list";

function openHistory() {
  renderHistory();
  $("history-dialog").showModal();
}

function renderHistory() {
  for (const b of document.querySelectorAll("[data-history-tab]")) {
    b.setAttribute("aria-selected", String(b.dataset.historyTab === historyTab));
  }
  const content = $("history-content");
  let orders;
  try {
    orders = loadOrders();
  } catch (e) {
    content.replaceChildren(el("p", { class: "error" }, `注文記録を読み込めませんでした（${e.message}）。`));
    $("download-csv").disabled = true;
    return;
  }
  $("download-csv").disabled = orders.length === 0;
  if (orders.length === 0) {
    content.replaceChildren(el("p", { class: "muted" }, "記録された注文はまだありません。"));
    return;
  }
  content.replaceChildren(...(historyTab === "list" ? renderOrderList(orders) : renderSummary(orders)));
}

function renderOrderList(orders) {
  return [
    el("p", { class: "muted" }, `${orders.length}件（古い順）`),
    ...orders.map((o) => el("div", { class: "order-card" },
      el("div", { class: "head" }, el("span", {}, `[${o.id}] ${o.orderedAt}`), el("span", {}, `合計 ${formatPrice(o.total)}`)),
      el("table", {}, el("tbody", {}, o.lines.map((l) => el("tr", {},
        el("td", {}, l.name), el("td", { class: "num" }, `x${l.quantity}`), el("td", { class: "num" }, formatPrice(l.price * l.quantity)))))))),
  ];
}

function renderSummary(orders) {
  const s = summarize(orders);
  const kpi = (label, value) => el("div", { class: "kpi" }, el("div", { class: "label" }, label), el("div", { class: "value" }, value));
  const table = (headers, rows) => el("div", { class: "table-wrap" }, el("table", {},
    el("thead", {}, el("tr", {}, headers.map(([h, cls]) => el("th", { class: cls || "" }, h)))),
    el("tbody", {}, rows.map((cells) => el("tr", {}, cells.map(([v, cls]) => el("td", { class: cls || "" }, v)))))));
  const ranking = (title, nameHeading, rows) => el("section", {}, el("h3", {}, title), table(
    [["順位", "num"], [nameHeading], ["個数", "num"], ["売上", "num"]],
    rows.map(([name, d], i) => [[i + 1, "num"], [name], [d.quantity, "num"], [formatPrice(d.sales), "num"]])));
  return [
    el("div", { class: "kpis" },
      kpi("注文件数", `${s.orderCount}件`), kpi("売上合計", formatPrice(s.totalSales)), kpi("平均客単価", formatPrice(s.average))),
    el("div", { class: "summary-grid" },
      el("div", {},
        el("section", {}, el("h3", {}, "日別売上"), table(
          [["日付"], ["件数", "num"], ["売上", "num"]],
          s.byDate.map(([date, d]) => [[date], [d.orders, "num"], [formatPrice(d.sales), "num"]]))),
        el("br"),
        ranking("カテゴリ別売上", "カテゴリ", s.byCategory)),
      ranking("品目別売上ランキング", "品名", s.byItem)),
  ];
}

function downloadCsv() {
  let orders;
  try {
    orders = loadOrders();
  } catch (e) {
    toast("注文記録を読み込めませんでした");
    return;
  }
  const blob = new Blob([ordersToCsv(orders)], { type: "text/csv" });
  const a = el("a", { href: URL.createObjectURL(blob), download: "orders.csv" });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ---- 起動 ----

document.title = `${STORE_NAME} 注文システム`;
$("store-name").textContent = STORE_NAME;
$("checkout-btn").addEventListener("click", openCheckout);
$("open-recommend").addEventListener("click", openRecommend);
$("open-history").addEventListener("click", openHistory);
$("download-csv").addEventListener("click", downloadCsv);
for (const b of document.querySelectorAll("[data-history-tab]")) {
  b.addEventListener("click", () => { historyTab = b.dataset.historyTab; renderHistory(); });
}
for (const b of document.querySelectorAll("[data-close]")) {
  b.addEventListener("click", () => b.closest("dialog").close());
}
setupRecommend();
setupPopular();
renderAllergenBar();
renderTabs();
renderMenu();
renderOrder();
renderPopular();
</script>
</body>
